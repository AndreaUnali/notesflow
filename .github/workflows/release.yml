name: Package release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build archives and Debian packages
        run: scripts/package-release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/notesflow-release"
      - name: Check packages and install Linux build
        working-directory: ${{ runner.temp }}/notesflow-release
        run: |
          sha256sum -c SHA256SUMS
          for arch in arm64 amd64; do
            test "$(dpkg-deb -f "notesflow-linux-$arch.deb" Architecture)" = "$arch"
          done
          chmod a+r ./notesflow-linux-amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ./notesflow-linux-amd64.deb
          test "$(notesflow --version)" = "notesflow ${GITHUB_REF_NAME#v}"
          notesflow --help
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/notesflow-release/* \
            --verify-tag --generate-notes
